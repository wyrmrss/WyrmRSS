port = 3002                                                 # default 3001
database_connection = "postgres://wyrm:wyrm@localhost/wyrm"
database_pool_size = 25                                     # default 30
public_url = "http://localhost:5173"                        # required, the URL you open Wyrm on

# Optional OpenID Connect sign-in, alongside password sign-in. Register
# {public_url}/api/v1/auth/oidc/callback as the callback URL at the provider.
# OIDC needs an https public_url and issuer, plain http only works on localhost.
#
# oidc_issuer_url = "https://sso.example.com/realms/wyrm"
# oidc_client_id = "wyrm"
# oidc_client_secret = "replace-me"  # omit for a public client
# oidc_allowed_subjects = "provider-subject-id-1,provider-subject-id-2" # optional, restricts who can sign in
